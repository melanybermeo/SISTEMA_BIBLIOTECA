<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Biblioteca Digital{% endblock %}</title>
  {% load static tailwind_tags %}
  {% tailwind_css %}
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Navbar -->
  <nav class="bg-indigo-600 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center">
          <div class="flex-shrink-0">
            <a href="{% url 'index' %}" class="text-white font-bold text-xl">Biblioteca Digital📖</a>
          </div>
          <div class="hidden md:block">
            <div class="ml-10 flex items-baseline space-x-4">
              <a href="{% url 'index' %}" class="{% if request.path == '/' %}bg-indigo-700 text-white{% else %}text-gray-100 hover:bg-indigo-500{% endif %} px-3 py-2 rounded-md text-sm font-medium">Inicio👩‍💻</a>
              <a href="{% url 'libros' %}" class="{% if '/libros/' in request.path %}bg-indigo-700 text-white{% else %}text-gray-100 hover:bg-indigo-500{% endif %} px-3 py-2 rounded-md text-sm font-medium">Libros📚</a>
            </div>
          </div>
        </div>
        <div class="hidden md:block">
          <div class="ml-4 flex items-center md:ml-6">
            <div class="relative">
              <form method="get" action="{% url 'libros' %}" class="flex">
                <input type="text" name="q" placeholder="Buscar libros..." class="px-3 py-1 rounded-l-md border-0 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <button type="submit" class="bg-indigo-700 text-white px-3 py-1 rounded-r-md hover:bg-indigo-800">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                  </svg>
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Mobile menu, show/hide based on menu state. -->
    <div class="md:hidden">
      <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
        <a href="{% url 'index' %}" class="{% if request.path == '/' %}bg-indigo-700 text-white{% else %}text-gray-100 hover:bg-indigo-500{% endif %} block px-3 py-2 rounded-md text-base font-medium">Inicio</a>
        <a href="{% url 'libros' %}" class="{% if '/libros/' in request.path %}bg-indigo-700 text-white{% else %}text-gray-100 hover:bg-indigo-500{% endif %} block px-3 py-2 rounded-md text-base font-medium">Libros</a>
      </div>
      <div class="pt-4 pb-3 border-t border-indigo-700">
        <form method="get" action="{% url 'libros' %}" class="px-2 flex">
          <input type="text" name="q" placeholder="Buscar libros..." class="px-3 py-1 flex-grow rounded-l-md border-0 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          <button type="submit" class="bg-indigo-700 text-white px-3 py-1 rounded-r-md hover:bg-indigo-800">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </button>
        </form>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="bg-indigo-800 text-gray-300 py-8 mt-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-col md:flex-row justify-between items-center">
        <div class="mb-4 md:mb-0">
          <h2 class="text-xl font-semibold text-white">Biblioteca Digital</h2>
          <p class="mt-2">Digital. Simple. Poderoso</p>
        </div>
        <div class="flex space-x-6">
          <a href="https://www.facebook.com/share/18F14S8KWX/?mibextid=wwXIfr" target="_blank" class="text-gray-400 hover:text-white">

            </svg>
          </a>
          <a href="https://x.com/mellthv32?s=11" target="_blank" class="text-gray-400 hover:text-white">

            </svg>
          </a>
        </div>
      </div>
      <div class="mt-8 border-t border-gray-700 pt-4 text-center">
        <p>© 2025 Melanie Bermeo. Todos los derechos reservados.</p>
      </div>
    </div>
  </footer>
</body>
</html>
