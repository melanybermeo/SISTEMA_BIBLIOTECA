name: CI - Sistema Biblioteca

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Construccion y pruebas
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: Biblioteca
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Melanie123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Descargar el codigo
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requeriments.txt

      - name: 4. Verificar sintaxis del codigo
        run: python -m compileall -q applications sistema_biblioteca theme manage.py

      - name: 5. Revisar configuracion de Django
        run: python manage.py check

      - name: 6. Aplicar migraciones
        run: python manage.py migrate --noinput

      - name: 7. Ejecutar pruebas automatizadas
        shell: bash
        run: python manage.py test --verbosity 2 2>&1 | tee reporte_pruebas.txt

      - name: 8. Generar reporte en el resumen
        if: always()
        shell: bash
        run: |
          echo "## Reporte CI - Sistema Biblioteca" >> $GITHUB_STEP_SUMMARY
          echo "- Rama: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Autor: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Resultado: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

      - name: 9. Subir reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-ci
          path: reporte_pruebas.txt